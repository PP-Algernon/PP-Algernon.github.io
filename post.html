<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="博客文章">
    <title>文章</title>
    <link rel="icon" id="favicon" href="static/assets/favicon.svg" type="image/svg+xml">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <!-- 代码高亮 -->
    <link id="hljs-theme-light" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
    <link id="hljs-theme-dark" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" disabled>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

    <link rel="stylesheet" href="static/css/main.css">
</head>
<body>
    <!-- 动态渐变背景 -->
    <div class="bg-scene" aria-hidden="true">
        <div class="bg-blob blob-1"></div>
        <div class="bg-blob blob-2"></div>
        <div class="bg-grid"></div>
    </div>

    <!-- 顶部导航栏 -->
    <nav class="navbar" id="main-nav">
        <div class="container nav-inner">
            <a class="nav-brand" href="home.html" id="nav-brand">
                <img id="nav-avatar" src="static/assets/img/avatar.jpg" alt="">
                <span id="nav-name">&nbsp;</span>
            </a>
            <button class="nav-toggle" id="nav-toggle" aria-label="菜单">
                <i class="bi bi-list"></i>
            </button>
            <div class="nav-menu" id="nav-menu">
                <ul class="nav-items" id="nav-items"></ul>
                <button class="icon-btn theme-toggle" id="theme-toggle" aria-label="切换深浅模式">
                    <i class="bi bi-moon-stars"></i>
                </button>
                <a class="icon-btn" id="nav-github" href="https://github.com" target="_blank" rel="noopener" aria-label="GitHub">
                    <i class="bi bi-github"></i>
                </a>
            </div>
        </div>
    </nav>

    <!-- 文章正文 -->
    <main class="container post-layout">
        <article class="glass-panel post-article fade-in">
            <a class="post-back" href="blog.html"><i class="bi bi-arrow-left"></i> 返回博客列表</a>
            <header class="post-header">
                <h1 id="post-title">&nbsp;</h1>
                <div class="post-meta" id="post-meta"></div>
            </header>
            <div class="md-body post-body" id="post-body">
                <p style="color:var(--text-muted)">加载中……</p>
            </div>
        </article>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <p id="copyright-text"></p>
            <p class="footer-note">Powered by <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a></p>
        </div>
    </footer>

    <script src="static/js/common.js"></script>
    <script src="static/js/post.js"></script>
</body>
</html>
