<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="个人主页">
    <title>个人主页</title>
    <link rel="icon" id="favicon" href="static/assets/favicon.svg" type="image/svg+xml">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>

    <link rel="stylesheet" href="static/css/main.css">
</head>
<body>
    <!-- 动态渐变背景 -->
    <div class="bg-scene" aria-hidden="true">
        <div class="bg-blob blob-1"></div>
        <div class="bg-blob blob-2"></div>
        <div class="bg-blob blob-3"></div>
        <div class="bg-grid"></div>
    </div>

    <!-- 顶部导航栏 -->
    <nav class="navbar" id="main-nav">
        <div class="container nav-inner">
            <a class="nav-brand" href="#top" id="nav-brand">
                <img id="nav-avatar" src="static/assets/img/avatar.svg" alt="">
                <span id="nav-name">&nbsp;</span>
            </a>
            <button class="nav-toggle" id="nav-toggle" aria-label="菜单">
                <i class="bi bi-list"></i>
            </button>
            <div class="nav-menu" id="nav-menu">
                <ul class="nav-items" id="nav-items"></ul>
                <button class="icon-btn theme-toggle" id="theme-toggle" aria-label="切换深浅模式">
                    <i class="bi bi-moon-stars"></i>
                </button>
                <a class="icon-btn" id="nav-github" href="https://github.com" target="_blank" rel="noopener" aria-label="GitHub">
                    <i class="bi bi-github"></i>
                </a>
            </div>
        </div>
    </nav>

    <!-- 主体：左侧个人信息 + 右侧内容 -->
    <main class="container layout" id="top">

        <!-- 左侧边栏 -->
        <aside class="sidebar">
            <div class="glass-panel profile-card fade-in">
                <div class="avatar-wrap">
                    <img id="profile-avatar" class="avatar-glow" src="static/assets/img/avatar.svg" alt="头像">
                    <span class="avatar-ring" aria-hidden="true"></span>
                </div>
                <h1 class="profile-name" id="profile-name">&nbsp;</h1>
                <p class="profile-bio" id="profile-bio"></p>
                <div class="profile-meta" id="profile-meta"></div>
                <a class="btn-gradient" id="profile-github-btn" href="https://github.com" target="_blank" rel="noopener">
                    <i class="bi bi-github"></i> 访问我的 GitHub
                </a>
            </div>

            <div class="glass-panel side-card fade-in delay-1" id="tech-card" hidden>
                <h3 class="side-card-title"><i class="bi bi-stack"></i> 技术栈</h3>
                <div class="tech-tags" id="tech-tags"></div>
            </div>

            <div class="glass-panel side-card fade-in delay-2" id="lang-card" hidden>
                <h3 class="side-card-title"><i class="bi bi-pie-chart-fill"></i> 语言分布</h3>
                <div class="chart-wrap"><canvas id="lang-chart"></canvas></div>
            </div>
        </aside>

        <!-- 右侧内容区（分区由 JS 渲染） -->
        <div class="content" id="sections"></div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <p id="copyright-text"></p>
            <p class="footer-note">Powered by <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a></p>
        </div>
    </footer>

    <script src="static/js/common.js"></script>
    <script src="static/js/main.js"></script>
</body>
</html>
